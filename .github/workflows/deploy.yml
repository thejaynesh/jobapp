name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check deployment inputs
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/deploy_changed.py "$BEFORE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  tests:
    uses: ./.github/workflows/test.yml

  image:
    needs: [tests, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build tested revision
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Keep intermediate dependency layers in GHCR even when the Actions
          # cache is evicted. The VPS only pulls the resulting runtime image.
          cache-from: |
            type=registry,ref=${{ steps.name.outputs.image }}:buildcache
            type=gha
          cache-to: type=registry,ref=${{ steps.name.outputs.image }}:buildcache,mode=max

  deploy:
    needs: [tests, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only releases enter this queue. A docs-only push must not replace a
    # pending runtime release, and an active SSH deployment must finish.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release is still current
        id: current
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$(python scripts/deploy_changed.py "$DEPLOY_SHA" origin/main)" == deploy=false ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded release: main has newer runtime changes or could not be compared."
          fi
      - name: Deploy tested image via SSH
        if: steps.current.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_IMAGE: ${{ needs.image.outputs.reference }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          command_timeout: 40m
          envs: DEPLOY_SHA,DEPLOY_IMAGE,REGISTRY_USERNAME,REGISTRY_TOKEN
          script: |
            set -eu
            cd /opt/jobapp
            git fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            bash scripts/deploy-vps.sh "$DEPLOY_IMAGE"
