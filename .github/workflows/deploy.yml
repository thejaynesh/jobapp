name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        id: deploy_first
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          script: |
            cd /opt/jobapp
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T web alembic upgrade head
            docker compose -f docker-compose.prod.yml restart nginx

      # Port 22 on the VPS periodically stops accepting connections for a few
      # minutes at a time — both attempts fail on `dial tcp :22: i/o timeout`,
      # then a manual re-run moments later connects in under 30 seconds. A
      # longer timeout doesn't help (a connect that never establishes just burns
      # a bigger window); more attempts spread further apart do. Three tries
      # across ~7 minutes have covered every outage observed so far.
      - name: Wait before retry
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 120

      - name: Deploy via SSH (retry)
        id: deploy_second
        continue-on-error: true
        if: steps.deploy_first.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          script: |
            cd /opt/jobapp
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T web alembic upgrade head
            docker compose -f docker-compose.prod.yml restart nginx

      - name: Wait before final retry
        if: steps.deploy_first.outcome == 'failure' && steps.deploy_second.outcome == 'failure'
        run: sleep 240

      # No continue-on-error: if this one fails the deploy has genuinely failed
      # and the run should go red rather than look successful.
      - name: Deploy via SSH (final retry)
        if: steps.deploy_first.outcome == 'failure' && steps.deploy_second.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          script: |
            cd /opt/jobapp
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T web alembic upgrade head
            docker compose -f docker-compose.prod.yml restart nginx
