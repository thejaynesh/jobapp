[project]
name = "jobapp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "jinja2==3.1.4",
    "httpx==0.27.2",
    "openai==1.58.1",
    "anthropic==0.115.0",
    "python-multipart==0.0.20",
    "playwright==1.49.1",
    # The IANA timezone database. `zoneinfo` reads it from the system, and
    # python:3.12-slim does not reliably ship one — without this every page
    # would quietly fall back to UTC, which is the bug this was added to fix.
    "tzdata==2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
]

# Without this, `pip install -e .` fails outside Docker: setuptools' flat-layout
# discovery sees app/, caddy/, alembic/ and extension/ as four top-level
# packages and refuses to guess. (The Docker build only worked because it
# copies pyproject.toml alone before installing.)
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
