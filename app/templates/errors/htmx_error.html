<div class="border rounded-lg px-4 py-3 text-sm flex items-start gap-3
  {% if status_code >= 500 %}bg-red-50 border-red-200 text-red-700
  {% elif status_code >= 400 %}bg-amber-50 border-amber-200 text-amber-700
  {% else %}bg-blue-50 border-blue-200 text-blue-700{% endif %}">
  <svg class="w-5 h-5 shrink-0 mt-0.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
    {% if status_code >= 500 %}
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
    {% else %}
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    {% endif %}
  </svg>
  <div class="flex-1 min-w-0">
    <span class="font-semibold">{{ status_code }}</span>
    <span class="ml-1">{{ detail }}</span>
    {% if status_code >= 500 %}
    <p class="text-xs mt-1 opacity-75">
      This error has been logged. Check the <a href="/activity" class="underline hover:no-underline">activity log</a> for details.
    </p>
    {% endif %}
  </div>
</div>
