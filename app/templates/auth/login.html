<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — JobApp</title>
  <link rel="stylesheet" href="/static/css/tailwind.min.css">
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/tailwind.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <h1 class="text-center font-bold text-blue-600 text-2xl mb-6">JobApp</h1>

    <form method="post" action="/login"
          class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm space-y-4">
      <input type="hidden" name="next" value="{{ next }}">

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>
        <input type="password" id="password" name="password" autocomplete="current-password"
               autofocus required
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      {% if error %}
      <p class="text-sm text-red-600">{{ error }}</p>
      {% endif %}

      <button type="submit"
              class="w-full bg-blue-600 text-white text-sm font-medium rounded px-4 py-2
                     hover:bg-blue-700">
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
