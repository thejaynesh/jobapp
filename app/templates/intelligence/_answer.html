<form method="post" action="/today/answer" class="mt-3">
  <input type="hidden" name="question_id" value="{{ row.id }}">
  <input type="hidden" name="question_kind" value="{{ row.kind or 'skill' }}">
  <input type="hidden" name="job_id" value="{{ answer_job_id }}">
  {% if not row.terms %}
  <label for="satisfaction-{{ row.id }}" class="text-sm">Do you meet this requirement?</label>
  <select id="satisfaction-{{ row.id }}" name="satisfaction" required class="block border rounded p-2 mt-1 mb-3">
    <option value="unsure">Unsure / needs clarification</option>
    <option value="meets">I meet this requirement</option>
    <option value="does_not_meet">I do not meet this requirement</option>
  </select>
  {% endif %}
  <label for="answer-{{ row.id }}" class="text-sm">Your factual explanation{% if row.terms %}, including the skill name{% endif %}</label>
  <textarea id="answer-{{ row.id }}" name="answer" maxlength="1600" required rows="2" class="border rounded p-2 w-full mt-1"></textarea>
  <button class="bg-blue-600 text-white rounded px-3 py-1.5 mt-2">Save factual clarification</button>
</form>
