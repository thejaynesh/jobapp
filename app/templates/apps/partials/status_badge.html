<span id="status-badge" class="text-xs px-2 py-1 rounded font-medium success-flash
  {% if app.status.value == 'applied' %}bg-blue-100 text-blue-700
  {% elif app.status.value == 'interviewing' %}bg-amber-100 text-amber-700
  {% elif app.status.value == 'offered' %}bg-green-100 text-green-700
  {% elif app.status.value == 'rejected' %}bg-red-100 text-red-600
  {% elif app.status.value == 'withdrawn' %}bg-gray-200 text-gray-500
  {% else %}bg-gray-100 text-gray-500{% endif %}">
  {{ app.status.value | replace("_", " ") | title }} &#10003;
</span>
