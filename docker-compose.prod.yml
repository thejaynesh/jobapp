services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-jobapp}
    # Told how much machine it is on. The defaults assume it might be sharing a
    # laptop with everything else: 128MB of shared_buffers, and a planner that
    # believes the operating system has almost nothing cached. On a 7.7GB box
    # holding a 300,000-row table that produced a database using 176MB of RAM
    # and reading 2.9GB off disk, because nothing it touched ever stayed
    # resident — every count re-read and re-decompressed the same descriptions.
    #
    # `effective_cache_size` is a hint rather than an allocation: it tells the
    # planner how much of the table it may assume is already in memory, which
    # is what makes it willing to consider an index scan over a sequential one.
    #
    # `work_mem` is per sort or hash *per query*, so it multiplies by
    # concurrency; 16MB is deliberately modest next to the rest.
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=5GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The one image. `web`, `worker`, `worker-interactive` and `beat` are the
  # same code with different commands, so they share a single build.
  #
  # All four used to say `build: .`. The build itself was fine — the layers are
  # identical, so they were cached after the first — but each service still got
  # its own *export*, and that is where the time went. Measured on the VPS:
  #
  #     => [web]                exporting to image   1275.5s
  #     => => exporting layers                         634.3s
  #     => => unpacking to jobapp-web:latest           632.3s
  #     ... the same again for worker, worker-interactive and beat
  #
  # Four copies of a multi-gigabyte image (texlive plus Chromium), written and
  # unpacked four times, contending on one disk — about twenty of the
  # twenty-three minutes a build took. It also kept ~16GB on disk where ~4GB
  # would do, which is the likeliest reason the layer cache got evicted and the
  # apt layer went cold in the first place.
  #
  # `image:` names what the build produces; the other three reference that name
  # and declare no build of their own, so `docker compose build` builds and
  # exports once. The name is local and unversioned on purpose — nothing pushes
  # this anywhere, and `up -d` runs after `build` in every path that deploys.
  web:
    build: .
    image: jobapp-app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - storage_data:/storage
    # No `ports:` on purpose — the proxy reaches this over the internal network
    # by name. Publishing 8000 would put a second, unproxied door on the host.
    expose:
      - "8000"
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Built by `web`. See the note there.
    image: jobapp-app
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=25 -Q batch -n batch@%h
    volumes:
      - storage_data:/storage
    env_file: .env
    restart: unless-stopped
    # Long enough for a task to finish on its own. Celery treats SIGTERM as a
    # warm shutdown — stop taking work, finish what is in hand — but Docker's
    # default is to wait ten seconds and then SIGKILL, which is shorter than an
    # enrichment pass or a document generation.
    #
    # A hard kill loses nothing (late acks put the task back on the queue), but
    # it skips the `finally` that releases the Redis lock, and those have a
    # thirty-minute TTL. So a deploy mid-pass bought half an hour of enrichment
    # logging "already running" and doing nothing, which reads exactly like a
    # broken deploy.
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The queue a person is waiting on: document generation, the browser
  # agent's work, the mailbox. Its own container because the batch worker
  # above can hold both its slots for twenty-five minutes at a time — a
  # matching pass and an enrichment pass both re-queue themselves — and a
  # "Generate documents" click should not wait behind a backlog.
  worker-interactive:
    # Built by `web`. See the note there.
    image: jobapp-app
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 -Q interactive -n interactive@%h
    volumes:
      - storage_data:/storage
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    # Built by `web`. See the note there.
    image: jobapp-app
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    restart: unless-stopped
    # Beat only publishes; there is nothing to finish. A short grace keeps a
    # deploy from waiting on a process that has no work in hand.
    stop_grace_period: 15s
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Bare domain, no scheme and no trailing slash, e.g. example.com
      APP_DOMAIN: ${APP_DOMAIN:?required}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - storage_data:/storage:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - web

volumes:
  postgres_data:
  storage_data:
  # Certificates and the ACME account key. Losing this means re-issuing on every
  # restart, which Let's Encrypt rate-limits.
  caddy_data:
  caddy_config:
