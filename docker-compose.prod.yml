services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-jobapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - storage_data:/storage
    # No `ports:` on purpose — the proxy reaches this over the internal network
    # by name. Publishing 8000 would put a second, unproxied door on the host.
    expose:
      - "8000"
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=25
    volumes:
      - storage_data:/storage
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Bare domain, no scheme and no trailing slash, e.g. example.com
      APP_DOMAIN: ${APP_DOMAIN:?required}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - storage_data:/storage:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - web

volumes:
  postgres_data:
  storage_data:
  # Certificates and the ACME account key. Losing this means re-issuing on every
  # restart, which Let's Encrypt rate-limits.
  caddy_data:
  caddy_config:
