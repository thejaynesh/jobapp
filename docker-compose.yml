services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobapp
      POSTGRES_PASSWORD: jobapp
      POSTGRES_DB: jobapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One image for all three, as in docker-compose.prod.yml — see the note
  # there. Same code, different commands, so building it once is enough; four
  # separate exports of a multi-gigabyte image was most of the build time.
  web:
    build: .
    image: jobapp-app-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - storage_data:/storage
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Built by `web`.
    image: jobapp-app-dev
    # Both queues in one worker for dev; production splits them so a
    # long batch pass cannot starve an interactive one.
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 -Q batch,interactive
    volumes:
      - .:/app
      - storage_data:/storage
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    # Built by `web`.
    image: jobapp-app-dev
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy


volumes:
  postgres_data:
  storage_data:
